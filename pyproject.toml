[project]
name = "aml-network-intelligence"
version = "0.1.0"
description = "Anti-Money Laundering detection using graph intelligence and machine learning."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "boutouileabdelkrim-pixel", email = "boutouileabdelkrim@mail.com" }
]
keywords = ["aml", "fraud-detection", "graph-ml", "xgboost", "shap", "fastapi", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core data
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.11,<2.0",
    "pyarrow>=16.0",
    # ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "shap>=0.45",
    # Graph
    "networkx>=3.3",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "torch>=2.3",
    "torch-geometric>=2.5",
    # API / serving
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    # Tracking / monitoring
    "mlflow>=2.14",
    "evidently>=0.4.30",
    "loguru>=0.7",
    # Utils
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "gensim>=4.3",
    "node2vec>=0.4",
    "cython>=3.0",
    "fastnode2vec==0.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbformat>=5.10",
    "httpx>=0.27",
    "kaggle>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# =========================================================
# Ruff — linter + formatter
# =========================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line too long (ML pipelines have long lines)
    "B904",    # raise from err (FastAPI conventions)
    "B905",    # zip() without strict= (Python 3.9 compat)
    "B007",    # loop control variable not used
    "B008",    # function call in default arg (FastAPI Depends)
    "N803",    # argument name lowercase (X_train convention)
    "N806",    # variable lowercase (X_train convention)
    "N812",    # lowercase imported as non-lowercase
    "N815",    # mixedCase variable in class scope
    "RUF001",  # ambiguous unicode in string (French accents)
    "RUF002",  # ambiguous unicode in docstring
    "RUF003",  # ambiguous unicode in comment
    "RUF046",  # unnecessary int() (harmless)
    "RUF059",  # unpacked variable not used
    "F841",    # local variable assigned but not used (heavily used in ML)
    "C901",    # function too complex (ML functions are complex)
    "SIM108",  # use ternary operator (readability preference)
]
# =========================================================
# Pytest
# =========================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
python_files = ["test_*.py"]

# =========================================================
# MyPy
# =========================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["notebooks/", "reports/"]
