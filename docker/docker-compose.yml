# =========================================================
# AML Network Intelligence — Docker Compose
# Services:
#   - mlflow : tracking server
#   - api    : FastAPI (added in Phase 9)
# =========================================================

services:

  # -------- MLflow tracking server --------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.0
    container_name: aml-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ../mlruns:/mlruns
    working_dir: /mlruns
    command: >
      mlflow server
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns/artifacts
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped

  # -------- FastAPI (activated in Phase 9) --------
